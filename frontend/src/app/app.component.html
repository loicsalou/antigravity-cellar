<div class="min-h-screen bg-gray-50">
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center">
            <span class="text-xl font-bold text-wine-800">🍷 Ma Cave</span>
          </div>
          <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
            <a routerLink="/bottles" routerLinkActive="border-wine-500 text-gray-900"
              class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
              Mes Bouteilles
            </a>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <!-- Not Logged In -->
          <div *ngIf="!user" class="flex gap-2">
            <button (click)="loginWithGoogle()"
              class="bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-50 flex items-center gap-2 transition-colors">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
              Google
            </button>
            <button (click)="loginWithFacebook()"
              class="bg-[#1877F2] text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-[#1864D9] flex items-center gap-2 transition-colors">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
              </svg>
              Facebook
            </button>
          </div>

          <!-- Logged In -->
          <div *ngIf="user" class="flex items-center gap-3">
            <span class="text-sm text-gray-700 font-medium">{{ user.name }}</span>
            <img *ngIf="user.picture" [src]="user.picture" class="w-8 h-8 rounded-full border border-gray-200"
              alt="Avatar">
            <button (click)="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium transition-colors">
              Déconnexion
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>
</div>
