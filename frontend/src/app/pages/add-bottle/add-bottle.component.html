<div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <span>🍷</span> Ajouter des bouteilles
        </h1>
        <p class="text-gray-600 mt-2">Remplissez le formulaire pour ajouter un lot de bouteilles identiques à votre cave
        </p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Wine Selection -->
            <div>
                <label for="wine" class="block text-sm font-medium text-gray-700 mb-2">
                    Vin <span class="text-red-500">*</span>
                </label>
                <select id="wine" name="wine" [(ngModel)]="formData.wineId" required
                    class="block w-full pl-3 pr-10 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-wine-500 focus:border-wine-500 rounded-md">
                    <option [ngValue]="null">Sélectionnez un vin</option>
                    <option *ngFor="let wine of wines" [ngValue]="wine.id">
                        {{ wine.name }} - {{ wine.vintage }} ({{ wine.producer?.name }})
                    </option>
                </select>
                <a routerLink="/wines/add"
                    class="mt-2 inline-flex items-center gap-1 text-sm text-wine-600 hover:text-wine-700 font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Créer un nouveau vin
                </a>
            </div>

            <!-- Cellar Selection -->
            <div>
                <label for="cellar" class="block text-sm font-medium text-gray-700 mb-2">
                    Cave <span class="text-red-500">*</span>
                </label>
                <select id="cellar" name="cellar" [(ngModel)]="formData.cellarId" required
                    class="block w-full pl-3 pr-10 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-wine-500 focus:border-wine-500 rounded-md">
                    <option [ngValue]="null">Sélectionnez une cave</option>
                    <option *ngFor="let cellar of cellars" [ngValue]="cellar.id">
                        {{ cellar.name }}
                    </option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700 mb-2">Prix unitaire (€)</label>
                    <input type="number" id="price" name="price" [(ngModel)]="formData.price" step="0.01"
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5">
                </div>

                <!-- Volume -->
                <div>
                    <label for="volume" class="block text-sm font-medium text-gray-700 mb-2">Volume (ml)</label>
                    <input type="number" id="volume" name="volume" [(ngModel)]="formData.volume"
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Purchase Date -->
                <div>
                    <label for="purchaseDate" class="block text-sm font-medium text-gray-700 mb-2">Date d'achat</label>
                    <input type="date" id="purchaseDate" name="purchaseDate" [(ngModel)]="formData.purchaseDate"
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5">
                </div>

                <!-- Quantity -->
                <div>
                    <label for="quantity" class="block text-sm font-medium text-gray-700 mb-2">
                        Quantité <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="quantity" name="quantity" [(ngModel)]="formData.quantity" min="1" required
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5">
                    <p class="mt-1 text-sm text-gray-500">Nombre de bouteilles identiques à ajouter</p>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="rounded-md bg-red-50 p-4 border border-red-200">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800">{{ error }}</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                <button type="button" (click)="onCancel()"
                    class="px-6 py-2.5 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 transition-colors">
                    Annuler
                </button>
                <button type="submit" [disabled]="loading"
                    class="px-6 py-2.5 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-wine-600 hover:bg-wine-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    <span *ngIf="loading" class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Ajout en cours...
                    </span>
                    <span *ngIf="!loading">Ajouter {{ formData.quantity }} bouteille(s)</span>
                </button>
            </div>
        </form>
    </div>
</div>
