<div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" (click)="onClose()">
        </div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title">
                            Ajouter des bouteilles
                        </h3>

                        <form (ngSubmit)="onSubmit()" class="space-y-4">
                            <!-- Wine Selection -->
                            <div>
                                <label for="wine" class="block text-sm font-medium text-gray-700">Vin *</label>
                                <select id="wine" name="wine" [(ngModel)]="formData.wineId" required
                                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-wine-500 focus:border-wine-500 sm:text-sm rounded-md">
                                    <option [ngValue]="null">Sélectionnez un vin</option>
                                    <option *ngFor="let wine of wines" [ngValue]="wine.id">
                                        {{ wine.name }} - {{ wine.vintage }} ({{ wine.producer?.name }})
                                    </option>
                                </select>
                            </div>

                            <!-- Cellar Selection -->
                            <div>
                                <label for="cellar" class="block text-sm font-medium text-gray-700">Cave *</label>
                                <select id="cellar" name="cellar" [(ngModel)]="formData.cellarId" required
                                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-wine-500 focus:border-wine-500 sm:text-sm rounded-md">
                                    <option [ngValue]="null">Sélectionnez une cave</option>
                                    <option *ngFor="let cellar of cellars" [ngValue]="cellar.id">
                                        {{ cellar.name }}
                                    </option>
                                </select>
                            </div>

                            <!-- Price -->
                            <div>
                                <label for="price" class="block text-sm font-medium text-gray-700">Prix (€)</label>
                                <input type="number" id="price" name="price" [(ngModel)]="formData.price" step="0.01"
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 sm:text-sm">
                            </div>

                            <!-- Purchase Date -->
                            <div>
                                <label for="purchaseDate" class="block text-sm font-medium text-gray-700">Date
                                    d'achat</label>
                                <input type="date" id="purchaseDate" name="purchaseDate"
                                    [(ngModel)]="formData.purchaseDate"
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 sm:text-sm">
                            </div>

                            <!-- Volume -->
                            <div>
                                <label for="volume" class="block text-sm font-medium text-gray-700">Volume (ml)</label>
                                <input type="number" id="volume" name="volume" [(ngModel)]="formData.volume"
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 sm:text-sm">
                            </div>

                            <!-- Quantity -->
                            <div>
                                <label for="quantity" class="block text-sm font-medium text-gray-700">Quantité *</label>
                                <input type="number" id="quantity" name="quantity" [(ngModel)]="formData.quantity"
                                    min="1" required
                                    class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 sm:text-sm">
                                <p class="mt-1 text-sm text-gray-500">Nombre de bouteilles identiques à ajouter</p>
                            </div>

                            <!-- Error Message -->
                            <div *ngIf="error" class="rounded-md bg-red-50 p-4">
                                <p class="text-sm text-red-800">{{ error }}</p>
                            </div>

                            <!-- Actions -->
                            <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
                                <button type="submit" [disabled]="loading"
                                    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-wine-600 text-base font-medium text-white hover:bg-wine-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
                                    <span *ngIf="loading">Ajout en cours...</span>
                                    <span *ngIf="!loading">Ajouter {{ formData.quantity }} bouteille(s)</span>
                                </button>
                                <button type="button" (click)="onClose()"
                                    class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 sm:mt-0 sm:w-auto sm:text-sm">
                                    Annuler
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
