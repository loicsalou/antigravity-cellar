<div class="bg-white shadow overflow-hidden sm:rounded-md">
    <div class="px-4 py-5 border-b border-gray-200 sm:px-6 flex justify-between items-center">
        <h3 class="text-lg leading-6 font-medium text-gray-900">
            <div class="bg-white shadow overflow-hidden sm:rounded-md">
                <div class="px-4 py-5 border-b border-gray-200 sm:px-6 flex justify-between items-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">
                        Mes Caves
                    </h3>
                    <button class="bg-wine-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-wine-700">
                        + Nouvelle Cave
                    </button>
                </div>
                <ul class="divide-y divide-gray-200">
                    <li *ngFor="let cellar of cellars">
                        <a href="#" class="block hover:bg-gray-50">
                            <div class="px-4 py-4 sm:px-6">
                                <div class="flex items-center justify-between">
                                    <p class="text-sm font-medium text-wine-600 truncate">
                                        {{ cellar.name }}
                                    </p>
                                    <div class="ml-2 flex-shrink-0 flex">
                                        <p
                                            class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                            Active
                                        </p>
                                    </div>
                                </div>
                                <div class="mt-2 sm:flex sm:justify-between">
                                    <div class="sm:flex">
                                        <p class="flex items-center text-sm text-gray-500">
                                            📍 ID: {{ cellar.id }}
                                        </p>
                                    </div>
                                    <div class="mt-2 flex items-center text-sm text-gray-500 sm:mt-0">
                                        <p>
                                            {{ cellar.racks?.length || 0 }} Casiers
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                    <li *ngIf="cellars.length === 0" class="px-4 py-4 sm:px-6 text-center text-gray-500">
                        Aucune cave trouvée. Créez-en une !
                    </li>
                </ul>
            </div>
