<div class="relative min-h-[calc(100vh-64px)] flex items-center justify-center overflow-hidden">
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="assets/images/wine_cellar_background.png" alt="Cave à vin" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-8 drop-shadow-lg">
            Gérez votre cave à vin <br class="hidden sm:block" />
            <span class="text-wine-400">en toute simplicité</span>
        </h1>

        <p class="mt-4 text-xl text-gray-200 mb-12 max-w-2xl mx-auto font-light leading-relaxed">
            Organisez, suivez et dégustez vos meilleurs crus. Une solution élégante pour les passionnés de vin.
        </p>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <!-- Not Logged In -->
            <ng-container *ngIf="!user">
                <button (click)="loginWithGoogle()"
                    class="w-full sm:w-auto flex items-center justify-center gap-3 px-8 py-4 bg-white text-gray-900 rounded-xl font-bold text-lg hover:bg-gray-50 transform hover:scale-105 transition-all duration-200 shadow-xl">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
                    Continuer avec Google
                </button>

                <button (click)="loginWithFacebook()"
                    class="w-full sm:w-auto flex items-center justify-center gap-3 px-8 py-4 bg-[#1877F2] text-white rounded-xl font-bold text-lg hover:bg-[#1864D9] transform hover:scale-105 transition-all duration-200 shadow-xl">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                    Continuer avec Facebook
                </button>
            </ng-container>

            <!-- Logged In -->
            <ng-container *ngIf="user">
                <a routerLink="/bottles"
                    class="w-full sm:w-auto flex items-center justify-center gap-3 px-8 py-4 bg-wine-600 text-white rounded-xl font-bold text-lg hover:bg-wine-700 transform hover:scale-105 transition-all duration-200 shadow-xl border border-wine-500">
                    <span>🍷</span>
                    Accéder à ma cave
                </a>
            </ng-container>
        </div>
    </div>
</div>
