<div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
            <span>🍇</span> Créer un vin
        </h1>
        <p class="text-gray-600 mt-2">Ajoutez un nouveau vin à la base de données</p>
    </div>

    <!-- Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Wine Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    Nom du vin <span class="text-red-500">*</span>
                </label>
                <input type="text" id="name" name="name" [(ngModel)]="formData.name" required
                    class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5 px-3"
                    placeholder="Ex: Château Margaux">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Vintage -->
                <div>
                    <label for="vintage" class="block text-sm font-medium text-gray-700 mb-2">Millésime</label>
                    <input type="number" id="vintage" name="vintage" [(ngModel)]="formData.vintage" min="1900"
                        max="2100"
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5 px-3"
                        placeholder="Ex: 2015">
                </div>

                <!-- Color -->
                <div>
                    <label for="color" class="block text-sm font-medium text-gray-700 mb-2">
                        Couleur <span class="text-red-500">*</span>
                    </label>
                    <select id="color" name="color" [(ngModel)]="formData.color" required
                        class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5 px-3">
                        <option value="">Sélectionnez une couleur</option>
                        <option *ngFor="let color of wineColors" [value]="color.value">{{ color.label }}</option>
                    </select>
                </div>
            </div>

            <!-- Appellation -->
            <div>
                <label for="appellation" class="block text-sm font-medium text-gray-700 mb-2">Appellation</label>
                <input type="text" id="appellation" name="appellation" [(ngModel)]="formData.appellation"
                    class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-wine-500 focus:border-wine-500 py-2.5 px-3"
                    placeholder="Ex: Margaux, Pomerol, Chablis...">
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="rounded-md bg-red-50 p-4 border border-red-200">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800">{{ error }}</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                <button type="button" (click)="onCancel()"
                    class="px-6 py-2.5 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 transition-colors">
                    Annuler
                </button>
                <button type="submit" [disabled]="loading"
                    class="px-6 py-2.5 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-wine-600 hover:bg-wine-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    <span *ngIf="loading" class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Création en cours...
                    </span>
                    <span *ngIf="!loading">Créer le vin</span>
                </button>
            </div>
        </form>
    </div>
</div>
