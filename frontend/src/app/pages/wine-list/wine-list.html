<div class="flex flex-col">
    <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
            <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                <div class="px-4 py-5 bg-white border-b border-gray-200 sm:px-6 flex justify-between items-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">
                        Inventaire des Vins
                    </h3>
                    <div class="flex space-x-3">
                        <input type="text" placeholder="Rechercher..."
                            class="shadow-sm focus:ring-wine-500 focus:border-wine-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border">
                        <button
                            class="bg-wine-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-wine-700">
                            + Ajouter
                        </button>
                    </div>
                </div>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Vin
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Millésime
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Région
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Prix
                            </th>
                            <th scope="col" class="relative px-6 py-3">
                                <span class="sr-only">Edit</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- Mock Data -->
                        <div class="flex flex-col">
                            <div class="-my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                                <div class="py-2 align-middle inline-block min-w-full sm:px-6 lg:px-8">
                                    <div class="shadow overflow-hidden border-b border-gray-200 sm:rounded-lg">
                                        <div
                                            class="px-4 py-5 bg-white border-b border-gray-200 sm:px-6 flex justify-between items-center">
                                            <h3 class="text-lg leading-6 font-medium text-gray-900">
                                                Inventaire des Vins
                                            </h3>
                                            <div class="flex space-x-3">
                                                <input type="text" placeholder="Rechercher..."
                                                    class="shadow-sm focus:ring-wine-500 focus:border-wine-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border">
                                                <button
                                                    class="bg-wine-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-wine-700">
                                                    + Ajouter
                                                </button>
                                            </div>
                                        </div>
                                        <table class="min-w-full divide-y divide-gray-200">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        Vin
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        Millésime
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        Région
                                                    </th>
                                                    <th scope="col"
                                                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                        Prix
                                                    </th>
                                                    <th scope="col" class="relative px-6 py-3">
                                                        <span class="sr-only">Edit</span>
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody class="bg-white divide-y divide-gray-200">
                                                <tr *ngFor="let wine of wines">
                                                    <td class="px-6 py-4 whitespace-nowrap">
                                                        <div class="flex items-center">
                                                            <div class="flex-shrink-0 h-10 w-10 rounded-full flex items-center justify-center"
                                                                [ngClass]="{
                         'bg-red-100 text-red-800': wine.color === 'RED',
                         'bg-yellow-100 text-yellow-800': wine.color === 'WHITE' || wine.color === 'YELLOW' || wine.color === 'DESSERT',
                         'bg-pink-100 text-pink-800': wine.color === 'ROSE',
                         'bg-blue-100 text-blue-800': wine.color === 'SPARKLING'
                       }">
                                                                <span *ngIf="wine.color === 'RED'">🍷</span>
                                                                <span
                                                                    *ngIf="wine.color === 'WHITE' || wine.color === 'YELLOW' || wine.color === 'DESSERT'">🥂</span>
                                                                <span *ngIf="wine.color === 'ROSE'">🌷</span>
                                                                <span *ngIf="wine.color === 'SPARKLING'">🍾</span>
                                                            </div>
                                                            <div class="ml-4">
                                                                <div class="text-sm font-medium text-gray-900">
                                                                    {{ wine.name }}
                                                                </div>
                                                                <div class="text-sm text-gray-500">
                                                                    {{ wine.appellation }}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td class="px-6 py-4 whitespace-nowrap">
                                                        <div class="text-sm text-gray-900">{{ wine.vintage }}</div>
                                                    </td>
                                                    <td class="px-6 py-4 whitespace-nowrap">
                                                        <span
                                                            class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                                            {{ wine.region?.name || 'Inconnue' }}
                                                        </span>
                                                    </td>
                                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        - <!-- Prix à calculer via les bouteilles -->
                                                    </td>
                                                    <td
                                                        class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                        <a href="#" class="text-wine-600 hover:text-wine-900">Editer</a>
                                                    </td>
                                                </tr>
                                                <tr *ngIf="wines.length === 0">
                                                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">Aucun
                                                        vin référencé.</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
