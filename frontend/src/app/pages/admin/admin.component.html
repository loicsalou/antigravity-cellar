<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Administration</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Importer des bouteilles (CSV)</h2>

        <div class="space-y-4">
            <div>
                <label for="cellarName" class="block text-sm font-medium text-gray-700">Nom de la cave</label>
                <div class="mt-1">
                    <input type="text" name="cellarName" id="cellarName" [(ngModel)]="cellarName"
                        class="shadow-sm focus:ring-wine-500 focus:border-wine-500 block w-full sm:text-sm border-gray-300 rounded-md"
                        placeholder="Ma Cave Principale">
                </div>
            </div>

            <div
                class="p-4 border-2 border-dashed border-gray-300 rounded-md bg-gray-50 flex flex-col items-center justify-center text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48"
                    aria-hidden="true">
                    <path
                        d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="mt-4 flex text-sm text-gray-600">
                    <label for="file-upload"
                        class="relative cursor-pointer bg-white rounded-md font-medium text-wine-600 hover:text-wine-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-wine-500">
                        <span>Télécharger un fichier</span>
                        <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".csv"
                            (change)="onFileSelected($event)">
                    </label>
                    <p class="pl-1">ou glisser-déposer</p>
                </div>
                <p class="text-xs text-gray-500">CSV séparé par des tabulations</p>
            </div>

            <div *ngIf="selectedFile" class="flex items-center justify-between bg-gray-100 p-3 rounded">
                <span class="text-sm text-gray-700 truncate">{{ selectedFile.name }}</span>
                <button (click)="selectedFile = null"
                    class="text-red-500 hover:text-red-700 text-sm font-medium">Supprimer</button>
            </div>

            <div class="flex justify-end">
                <button (click)="upload()" [disabled]="!selectedFile || !cellarName || uploadStatus === 'uploading'"
                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-wine-600 hover:bg-wine-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-wine-500 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="uploadStatus === 'uploading'" class="mr-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    {{ uploadStatus === 'uploading' ? 'Importation...' : 'Importer' }}
                </button>
            </div>

            <!-- Success Message -->
            <div *ngIf="uploadStatus === 'success'" class="rounded-md bg-green-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                            fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-green-800">
                            Importation réussie ! Vos bouteilles ont été ajoutées.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="uploadStatus === 'error'" class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                            fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800">
                            {{ errorMessage }}
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
